name: Backend Production CI/CD

on:
  push:
    branches: [production]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-production.yml'

  workflow_dispatch:

env:
  NODE_VERSION: '22'
  WORKING_DIR: ./backend

jobs:
  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: npm ci

      - name: Run ESLint
        working-directory: ${{ env.WORKING_DIR }}
        run: npm run lint

  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    needs: lint

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: npm ci

      - name: Run tests
        working-directory: ${{ env.WORKING_DIR }}
        run: npm test -- --ci
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/backend_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret
          JWT_REFRESH_SECRET: test-refresh-secret

  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: npm ci

      - name: Build app
        working-directory: ${{ env.WORKING_DIR }}
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: backend/dist

  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: npm ci

      - name: Run npm audit
        working-directory: ${{ env.WORKING_DIR }}
        run: npm audit --audit-level=high
        continue-on-error: true

  deploy:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: security
    environment:
      name: production

    steps:
      - uses: actions/checkout@v4

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: backend-build
          path: backend/dist

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: 22
          script: |
            set -e

            echo "📥 Updating code..."
            cd ${{ secrets.APP_PATH }}
            git fetch origin main
            git reset --hard origin/main

            echo "📦 Installing dependencies..."
            cd backend
            npm ci --production=false

            echo "🏗️ Building app..."
            npm run build

            echo "📝 Writing .env..."
            cat > .env << 'EOF'
            ${{ secrets.BACKEND_ENV }}
            EOF

            echo "🔐 Ensuring JWT secrets..."
            grep -q JWT_SECRET .env || echo "JWT_SECRET=$(openssl rand -hex 64)" >> .env
            grep -q JWT_REFRESH_SECRET .env || echo "JWT_REFRESH_SECRET=$(openssl rand -hex 64)" >> .env

            echo "🔄 Restarting with PM2..."
            pm2 reload backend --update-env || pm2 start npm --name backend -- start
            pm2 save

            echo "🏥 Health check..."
            sleep 5
            curl -f http://localhost:3000/api/v1/health

            echo "✅ Production deployment successful"
