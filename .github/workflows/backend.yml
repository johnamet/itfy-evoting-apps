name: Backend CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch: # Allow manual trigger

env:
  NODE_VERSION: '22.19.0'
  WORKING_DIR: ./backend

jobs:
  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: npm ci

      - name: Run ESLint
        working-directory: ${{ env.WORKING_DIR }}
        run: npm run lint

  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    needs: lint
    
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: npm ci

      - name: Run tests
        working-directory: ${{ env.WORKING_DIR }}
        run: npm test -- --coverage --ci
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/itfy_evoting_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-jwt-secret-for-ci-pipeline
          JWT_REFRESH_SECRET: test-jwt-refresh-secret-for-ci-pipeline
          USE_IN_MEMORY_CACHE: true

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ${{ env.WORKING_DIR }}/coverage
          fail_ci_if_error: false
          verbose: true

  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: npm ci

      - name: Build
        working-directory: ${{ env.WORKING_DIR }}
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: backend/dist
          retention-days: 7

  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: npm ci

      - name: Run npm audit
        working-directory: ${{ env.WORKING_DIR }}
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=backend/package.json --severity-threshold=high

  deploy-staging:
    name: 🚀 Deploy to Staging
    runs-on: ubuntu-latest
    needs: [test, build, security]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment:
      name: staging
      url: ${{ secrets.STAGING_URL }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend-build
          path: backend/dist

      - name: Deploy to Staging Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USERNAME }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_PORT || 22 }}
          script: |
            set -e
            
            echo "📥 Pulling latest code..."
            cd ${{ secrets.STAGING_APP_PATH }}
            git fetch origin develop
            git reset --hard origin/develop
            
            echo "🔧 Installing dependencies..."
            cd backend
            npm ci --production=false
            
            echo "🏗️ Building application..."
            npm run build
            
            echo "📝 Updating environment variables..."
            cat > .env << 'EOF'
            ${{ secrets.STAGING_BACKEND_ENV }}
            EOF
            
            echo "🔐 Ensuring JWT secrets..."
            if ! grep -q "^JWT_SECRET=" .env || [ -z "$(grep "^JWT_SECRET=" .env | cut -d'=' -f2)" ]; then
              echo "JWT_SECRET=$(openssl rand -base64 64 | tr -d '\n')" >> .env
            fi
            if ! grep -q "^JWT_REFRESH_SECRET=" .env || [ -z "$(grep "^JWT_REFRESH_SECRET=" .env | cut -d'=' -f2)" ]; then
              echo "JWT_REFRESH_SECRET=$(openssl rand -base64 64 | tr -d '\n')" >> .env
            fi
            
            echo "🔄 Restarting service..."
            pm2 restart backend --update-env || pm2 start npm --name "backend" -- start
            pm2 save
            
            echo "🏥 Health check..."
            sleep 5
            curl -f http://localhost:3000/api/v1/health || echo "Health check warning"
            
            echo "✅ Staging deployment complete!"

  deploy-production:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: [test, build, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: ${{ secrets.PRODUCTION_URL }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend-build
          path: backend/dist

      - name: Deploy to Production Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: ${{ secrets.DO_PORT || 22 }}
          script: |
            set -e
            
            echo "📥 Pulling latest code..."
            cd ${{ secrets.APP_PATH }}
            git fetch origin main
            git reset --hard origin/main
            
            echo "🔧 Installing dependencies..."
            cd backend
            npm ci --production=false
            
            echo "🏗️ Building application..."
            npm run build
            
            echo "📝 Updating environment variables..."
            cat > .env << 'EOF'
            ${{ secrets.BACKEND_ENV }}
            EOF
            
            echo "🔐 Ensuring JWT secrets..."
            if ! grep -q "^JWT_SECRET=" .env || [ -z "$(grep "^JWT_SECRET=" .env | cut -d'=' -f2)" ]; then
              echo "JWT_SECRET=$(openssl rand -base64 64 | tr -d '\n')" >> .env
            fi
            if ! grep -q "^JWT_REFRESH_SECRET=" .env || [ -z "$(grep "^JWT_REFRESH_SECRET=" .env | cut -d'=' -f2)" ]; then
              echo "JWT_REFRESH_SECRET=$(openssl rand -base64 64 | tr -d '\n')" >> .env
            fi
            
            echo "🔄 Restarting service with zero-downtime..."
            pm2 reload backend --update-env || pm2 start npm --name "backend" -- start
            pm2 save
            
            echo "🏥 Health check..."
            sleep 5
            curl -f http://localhost:3000/api/v1/health || exit 1
            
            echo "✅ Production deployment complete!"

      - name: Notify on success
        if: success()
        run: |
          echo "🎉 Backend deployment to production successful!"
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Backend deployment to production failed!"
          echo "Commit: ${{ github.sha }}"
          echo "Check the logs for details."
